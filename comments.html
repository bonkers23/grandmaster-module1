<!DOCTYPE html>
<html>
  <head>
    <title>Comments in HTML</title>
  </head>

  <body>
    <h1>Comments in HTML</h1>

    <!-- This is a single-line comment -->
    <p>This paragraph is visible on the webpage.</p>

    <!-- 
      This is a multi-line comment.
      Comments are not displayed on the browser.
      They are only visible in the source code.
    -->

    <p>
      HTML comments are used to explain code,
      make it readable, and help in debugging.
    </p>

    <!-- Commenting out an element -->
    <!-- <h2>This heading will not be displayed</h2> -->

    <p>
      Using comments is a good practice for both teachers and students.
    </p>
  </body>
</html>
