<!DOCTYPE html>
<html>
  <head>
    <title>Hyperlink in HTML</title>
  </head>

  <body>
    <h1>Hyperlink in HTML</h1>

    <p>
      A hyperlink is used to move from one webpage to another.
    </p>

    <p>
      Click the link below to visit my LinkedIn profile:
    </p>

    <a href="https://www.linkedin.com/in/shariq-hashmi-6793a5250">
      Visit My LinkedIn Profile
    </a>

    <p>
      Hyperlinks are created using the <b>&lt;a&gt;</b> tag.
    </p>
  </body>
</html>
