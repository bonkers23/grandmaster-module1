<!DOCTYPE html>
<html>
  <head>
    <title>Iframe in HTML</title>
  </head>

  <body>
    <h1>Iframe in HTML</h1>

    <p>
      The iframe tag is used to embed online content
      such as videos into a webpage.
    </p>

    <h2>YouTube Video Example</h2>

    <iframe 
      width="560" 
      height="315" 
      src="https://www.youtube.com/embed/F4O0WtzDztE?si=VvVSEFeTdELHgEcl"
      title="YouTube video player" 
      frameborder="0" 
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
      referrerpolicy="strict-origin-when-cross-origin" 
      allowfullscreen>
    </iframe>

  </body>
</html>
