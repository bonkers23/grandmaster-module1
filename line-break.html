<!DOCTYPE html>
<html>
  <head>
    <title>Line Break in HTML</title>
  </head>

  <body>
    <h1>Line Break in HTML</h1>

    <p>
      This is the first line.<br>
      This is the second line.<br>
      This is the third line.
    </p>

    <p>
      The &lt;br&gt; tag is used to break a line<br>
      without starting a new paragraph.
    </p>

    <p>
      Line breaks are useful<br>
      when writing addresses,<br>
      poems, or short lines.
    </p>
  </body>
</html>
