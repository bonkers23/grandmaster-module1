<!DOCTYPE html>
<html>
  <head>
    <title>Table in HTML</title>
  </head>

  <body>
    <h1>Table in HTML</h1>

    <p>
      Tables are used to display data in rows and columns.
    </p>

    <table border="1">
      <tr>
        <th>Name</th>
        <th>Subject</th>
        <th>Marks</th>
      </tr>

      <tr>
        <td>Rahul</td>
        <td>Math</td>
        <td>85</td>
      </tr>

      <tr>
        <td>Ananya</td>
        <td>Science</td>
        <td>90</td>
      </tr>
    </table>

    <p>
      Tables help in organizing information clearly.
    </p>
  </body>
</html>
